  - CKV2_AWS_62 # event notifications: nenhum consumidor de eventos de bucket na arquitetura
  # Rede/observabilidade paga:
  - CKV2_AWS_11 # VPC flow logs: custo de CloudWatch; rede 100% privada com SGs mínimos
  # RDS — recursos não suportados/pagos no db.t3.micro do free tier:
  - CKV2_AWS_30 # query logging do Postgres: custo/ruído sem requisito de auditoria SQL
  - CKV_AWS_129 # export de logs do RDS para CloudWatch: idem
  - CKV_AWS_353 # performance insights: não suportado em db.t3.micro
  - CKV_AWS_118 # enhanced monitoring: agente cobrado por instância
