name: Rollback

# Rollback manual da infra: faz checkout de um ref antigo (idealmente uma tag
# de versão vX.Y.Z criada pelo CD — release.yml — a cada merge na master) e
# aplica aquela configuração sobre o state remoto. Único ponto da esteira
# autorizado a rodar apply — sempre disparado por humano, com plan salvo
# como auditoria.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Ambiente alvo do rollback"
        required: true
        type: choice
        options:
          - prod
        default: prod
      target_ref:
        description: "Tag de versão (recomendado, ex.: v1.2.3 — criada pelo CD em cada merge na master) ou SHA do commit para o qual voltar"
        required: true
        type: string
      mode:
        description: "plan = só mostra o que mudaria; apply = executa o rollback"
        required: true
        type: choice
        options:
          - plan
          - apply
        default: plan
      reason:
        description: "Motivo do rollback (auditoria)"
        required: false
        type: string

permissions:
  contents: read

# Serializa operações que tocam o state (rollback/destroy não rodam juntos).
concurrency:
  group: terraform-state-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
      TF_ENV: ${{ inputs.environment }}

    # Passos chamam alvos do Makefile (fonte única dos comandos). Atenção:
    # o checkout do target_ref traz o Makefile daquela época — rollbacks só
    # funcionam para refs que já contêm os alvos tf-plan-out/tf-apply-plan/
    # tf-ensure-bundle.
    steps:
      - name: Log da operação (auditoria)
        run: |
          echo "Rollback de '${{ inputs.environment }}' para '${{ inputs.target_ref }}'"
          echo "Modo: ${{ inputs.mode }} | Ator: ${{ github.actor }}"
          echo "Motivo: ${{ inputs.reason || 'não informado' }}"

      # Historico completo (fetch-depth 0) só para validar o ref — evita um
      # `actions/checkout` direto com `ref` inválido, que falha com um erro
      # git genérico em vez de explicar o que fazer.
      - name: Checkout completo (para validar o target_ref)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validar e fazer checkout do target_ref
        run: |
          if ! git rev-parse --verify --quiet "${{ inputs.target_ref }}^{commit}" >/dev/null; then
            echo "::error::Ref '${{ inputs.target_ref }}' não existe neste repositório. Prefira uma tag de release (vX.Y.Z, criada pelo workflow CD em cada merge na master) ou um SHA de commit válido."
            exit 1
          fi
          case "${{ inputs.target_ref }}" in
            v[0-9]*.[0-9]*.[0-9]*) : ;;
            *) echo "::warning::'${{ inputs.target_ref }}' não segue o padrão vX.Y.Z; o rollback funciona com qualquer ref, mas o padrão recomendado é usar tags de release." ;;
          esac
          git checkout "${{ inputs.target_ref }}"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Pré-condição do apply: o gate da EC2 (data aws_s3_object) exige o
      # bundle da API no bucket de artefatos — sem ele o apply morre após
      # ~12 min de retry do provider, deixando infra parcial. OVERWRITE=1
      # publica o bundle DESTE ref (rollback também do código da API: etag
      # novo => user_data novo => EC2 substituída); AUTO_APPROVE=1 cobre o
      # bootstrap do zero (fase 1 cria o storage sem confirmação interativa).
      - name: Garantir bundle da API do ref alvo
        if: inputs.mode == 'apply'
        run: |
          python -m pip install --upgrade pip boto3
          make tf-ensure-bundle AUTO_APPROVE=1 OVERWRITE=1

      - name: Terraform Plan (rollback)
        run: make tf-plan-out

      - name: Upload rollback plan (auditoria)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rollback-plan-${{ inputs.environment }}-${{ github.run_id }}
          path: infra/terraform/environments/${{ inputs.environment }}/plan.txt
          if-no-files-found: ignore

      # Aplica exatamente o plan salvo acima (sem re-planejar entre plan e apply).
      - name: Terraform Apply (rollback)
        if: inputs.mode == 'apply'
        run: make tf-apply-plan
