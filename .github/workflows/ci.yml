name: CI

on:
  push:
    branches: ["main", "master", "feature/**", "chore/**", "fix/**", "docs/**"]
  # Critério da story: pipeline roda em todo PR para a main (quality gates;
  # o job terraform fica de fora de PRs para não expor secrets a forks).
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[prod]

      - name: Code format check
        run: make check-format

      - name: Static sanity check
        run: make lint

  security:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[prod]

      # Gate: falha o build em vulnerabilidades (bandit + pip-audit).
      - name: Security checks
        run: make security

      # Relatório SARIF para a aba Security > Code scanning (não bloqueia).
      # bandit-sarif-formatter é plugin do bandit (formato "sarif"), não CLI.
      - name: Bandit SARIF report
        if: always()
        run: |
          pip install bandit-sarif-formatter
          bandit -r src -f sarif -o bandit.sarif || true

      - name: Upload Bandit SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: bandit.sarif
          category: bandit

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-reports
          path: bandit.sarif
          if-no-files-found: ignore

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]

      - name: Tests with coverage + JUnit
        run: >
          pytest
          --junitxml=junit-${{ matrix.python-version }}.xml
          --cov=src --cov-report=xml --cov-report=html

      # Gate explícito de arquitetura: estáticos validam o HCL sem AWS;
      # os live pulam sem credenciais (skip gracioso, não quebra a matrix).
      - name: Architecture tests (TAAC)
        run: make test-taac

      - name: Upload test artifacts (py${{ matrix.python-version }})
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-py${{ matrix.python-version }}
          path: |
            junit-${{ matrix.python-version }}.xml
            coverage.xml
            htmlcov/
          if-no-files-found: ignore

  terraform:
    runs-on: ubuntu-latest
    environment: prod
    # Só em push de branches de trabalho (nunca em PR: secrets protegidos de forks).
    if: >-
      github.event_name == 'push' &&
      (startsWith(github.ref, 'refs/heads/feature/') ||
       startsWith(github.ref, 'refs/heads/chore/'))
    needs: [lint, security, test]

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
      TF_ENV: ${{ vars.TF_ENV || 'prod' }}

    # Todos os passos chamam alvos do Makefile (fonte única dos comandos —
    # o que roda aqui é o mesmo que roda local).
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Resolve target environment
        run: echo "Usando TF_ENV=$TF_ENV (infra/terraform/environments/$TF_ENV)"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      # fmt e checkov varrem a árvore inteira (modules/ + environments/ +
      # bootstrap/) — módulo fora do padrão quebra aqui.
      - name: Terraform fmt check
        run: make tf-fmt-check

      - name: Terraform Validate (sem backend)
        run: make tf-validate

      - name: TFLint
        run: make tf-lint

      - name: Checkov (segurança de IaC)
        run: |
          pip install "checkov>=3.2,<4"
          make tf-security CHECKOV_ARGS='--quiet --compact --output cli --output sarif --output-file-path console,infra/terraform'

      - name: Upload Checkov SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: infra/terraform/results_sarif.sarif
          category: checkov

      # Teste de integração com a AWS: o plan autentica e consulta a conta via
      # STS, validando credenciais e conectividade reais. O plan é salvo como
      # artefato (trilha de auditoria do que seria aplicado).
      - name: Terraform Plan (integração com AWS)
        run: make tf-plan-out

      - name: Upload Terraform plan
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: terraform-plan
          path: |
            infra/terraform/environments/${{ env.TF_ENV }}/plan.txt
            infra/terraform/results_sarif.sarif
          if-no-files-found: ignore
