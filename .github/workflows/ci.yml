name: CI

on:
  push:
    branches: ["main", "master", "feature/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[prod]

      - name: Code format check
        run: make check-format

      - name: Static sanity check
        run: make lint

  security:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[prod]

      # Gate: falha o build em vulnerabilidades (bandit + pip-audit).
      - name: Security checks
        run: make security

      # Relatório SARIF para a aba Security > Code scanning (não bloqueia).
      - name: Bandit SARIF report
        if: always()
        run: |
          bandit -r src -f json -o bandit-report.json || true
          pip install bandit-sarif-formatter
          bandit-sarif-formatter -i bandit-report.json -o bandit.sarif || true

      - name: Upload Bandit SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit.sarif
          category: bandit

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: bandit.sarif
          if-no-files-found: ignore

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]

      - name: Tests with coverage + JUnit
        run: >
          pytest
          --junitxml=junit-${{ matrix.python-version }}.xml
          --cov=src --cov-report=xml --cov-report=html

      - name: Upload test artifacts (py${{ matrix.python-version }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-py${{ matrix.python-version }}
          path: |
            junit-${{ matrix.python-version }}.xml
            coverage.xml
            htmlcov/
          if-no-files-found: ignore

  terraform:
    runs-on: ubuntu-latest
    environment: prod
    if: startsWith(github.ref, 'refs/heads/feature/')
    needs: [lint, security, test]

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
      TF_ENV: ${{ vars.TF_ENV || 'prod' }}

    defaults:
      run:
        working-directory: infra/terraform/environments/${{ env.TF_ENV }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Resolve target environment
        run: echo "Usando TF_ENV=$TF_ENV (infra/terraform/environments/$TF_ENV)"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: TFLint
        run: tflint

      - name: Checkov (segurança de IaC)
        run: |
          pip install "checkov>=3.2,<4"
          checkov -d . --quiet --compact --output cli --output sarif --output-file-path console,.

      - name: Upload Checkov SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: infra/terraform/environments/${{ env.TF_ENV }}/results_sarif.sarif
          category: checkov

      # Teste de integração com a AWS: o plan autentica e consulta a conta via
      # STS, validando credenciais e conectividade reais. O plan é salvo como
      # artefato (trilha de auditoria do que seria aplicado).
      - name: Terraform Plan (integração com AWS)
        run: |
          terraform plan -no-color -out=tfplan
          terraform show -no-color tfplan > plan.txt

      - name: Upload Terraform plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: |
            infra/terraform/environments/${{ env.TF_ENV }}/plan.txt
            infra/terraform/environments/${{ env.TF_ENV }}/results_sarif.sarif
          if-no-files-found: ignore
