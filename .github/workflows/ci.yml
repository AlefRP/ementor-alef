name: CI

# Gatilhos no padrão de referência (HashiCorp e SonarCloud): pull_request
# valida o que VAI entrar na master; push na master valida o que ENTROU e
# aplica a infra (merge-before-apply). Push de branch de trabalho não dispara
# a esteira — com PR aberto, o par push+pull_request rodava tudo em dobro
# (grupos de concurrency diferentes). Feedback antes do PR: make quality.
on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

# PRs: um push novo cancela o run anterior. Push na master nunca cancela —
# interromper um apply no meio deixa a infra em estado parcial.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  security-events: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[prod]

      - name: Code format check
        run: make check-format

      - name: Static sanity check
        run: make lint

  security:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[prod]

      # Gate: falha o build em vulnerabilidades (bandit + pip-audit).
      - name: Security checks
        run: make security

      # Relatório SARIF para a aba Security > Code scanning (não bloqueia).
      # bandit-sarif-formatter é plugin do bandit (formato "sarif"), não CLI.
      - name: Bandit SARIF report
        if: always()
        run: |
          pip install bandit-sarif-formatter
          bandit -r src -f sarif -o bandit.sarif || true

      - name: Upload Bandit SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: bandit.sarif
          category: bandit

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-reports
          path: bandit.sarif
          if-no-files-found: ignore

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]

      - name: Tests with coverage + JUnit
        run: >
          pytest
          --junitxml=junit-${{ matrix.python-version }}.xml
          --cov=src --cov-report=xml --cov-report=html

      # Gate explícito de arquitetura: estáticos validam o HCL sem AWS;
      # os live pulam sem credenciais (skip gracioso, não quebra a matrix).
      - name: Architecture tests (TAAC)
        run: make test-taac

      - name: Upload test artifacts (py${{ matrix.python-version }})
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-py${{ matrix.python-version }}
          path: |
            junit-${{ matrix.python-version }}.xml
            coverage.xml
            htmlcov/
          if-no-files-found: ignore

  # Gates de Terraform que rodam sem AWS (fmt/validate/tflint/checkov):
  # em todo PR (inclusive de fork — não usam secrets) e no push da master.
  terraform-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      # fmt e checkov varrem a árvore inteira (modules/ + environments/ +
      # bootstrap/) — módulo fora do padrão quebra aqui.
      - name: Terraform fmt check
        run: make tf-fmt-check

      - name: Terraform Validate (sem backend)
        run: make tf-validate

      - name: TFLint
        run: make tf-lint

      - name: Checkov (segurança de IaC)
        run: |
          pip install "checkov>=3.2,<4"
          make tf-security CHECKOV_ARGS='--quiet --compact --output cli --output sarif --output-file-path console,infra/terraform/results_sarif.sarif'

      # O checkov põe no SARIF também os achados já cobertos por #checkov:skip,
      # e o GitHub abre um alerta de code scanning para cada um — o PR fica com
      # dezenas de "Checkov / <regra>" mesmo com o gate acima verde. Sobe só o
      # que ainda não tem decisão registrada no HCL (o gate segue reprovando
      # qualquer achado não suprimido; o filtro não afeta o exit code).
      - name: Remover achados suprimidos do SARIF
        if: always()
        run: python scripts/ci/filter_sarif.py infra/terraform/results_sarif.sarif

      - name: Upload Checkov SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: infra/terraform/results_sarif.sarif
          category: checkov

  # Plan no PR (padrão HashiCorp merge-before-apply: o review do PR inclui o
  # que o merge fará na infra). Só PRs do próprio repo — fork não recebe
  # secrets (regra do GitHub), então o job nem tenta autenticar.
  terraform-plan:
    runs-on: ubuntu-latest
    environment: prod
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: [lint, security, test, terraform-checks]

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
      TF_ENV: ${{ vars.TF_ENV || 'prod' }}

    # Todos os passos chamam alvos do Makefile (fonte única dos comandos —
    # o que roda aqui é o mesmo que roda local).
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Resolve target environment
        run: echo "Usando TF_ENV=$TF_ENV (infra/terraform/environments/$TF_ENV)"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      # Bundle offline da API (wheelhouse) para a EC2 privada, entregue via
      # S3 (gateway endpoint na VPC). Roda ANTES do plan: quando o storage já
      # está no state, o plan lê o gate do bundle (data aws_s3_object) — sem o
      # objeto no bucket, o plan falharia. Enquanto o apply manual não criar o
      # bucket de artefatos, o passo avisa e segue (com state vazio o gate é
      # adiado para o apply e o plan passa).
      - name: Build e upload do bundle da API
        run: |
          make api-bundle
          BUCKET="${{ vars.ARTIFACTS_BUCKET || 'alef-rp-aws-lakehouse-prod-artifacts' }}"
          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            aws s3 cp build/api-bundle.tar.gz "s3://$BUCKET/api/api-bundle.tar.gz"
          else
            echo "::warning::bucket $BUCKET ainda nao existe - rode make tf-apply e re-execute a esteira"
          fi

      # O plan autentica e consulta a conta via STS, validando credenciais e
      # conectividade reais. Salvo como artefato: é o que o merge vai aplicar.
      - name: Terraform Plan
        run: make tf-plan-out

      - name: Upload Terraform plan
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: terraform-plan
          path: infra/terraform/environments/${{ env.TF_ENV }}/plan.txt
          if-no-files-found: ignore

  # Apply automático quando o merge cai na master (merge-before-apply,
  # https://developer.hashicorp.com/terraform/tutorials/automation/github-actions).
  # O plan foi revisado no PR; aqui os gates re-rodam sobre o commit de merge,
  # um plan novo é salvo como auditoria e aplicado EXATAMENTE como salvo
  # (sem re-planejar entre plan e apply). Voltar atrás: workflow Rollback.
  terraform-apply:
    runs-on: ubuntu-latest
    environment: prod
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: [lint, security, test, terraform-checks]

    # Mesmo grupo do rollback/destroy: operações sobre o state nunca em
    # paralelo. Nunca cancelar um apply em andamento.
    concurrency:
      group: terraform-state-${{ vars.TF_ENV || 'prod' }}
      cancel-in-progress: false

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
      TF_ENV: ${{ vars.TF_ENV || 'prod' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Resolve target environment
        run: echo "Usando TF_ENV=$TF_ENV (infra/terraform/environments/$TF_ENV)"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      # Recompila e publica o bundle do commit de merge via tf-ensure-bundle —
      # o gate da EC2 (data aws_s3_object) e o etag no user_data leem daqui.
      # OVERWRITE=1 entrega a versão da master (sobrescreve bundle de PR
      # anterior); AUTO_APPROVE=1 cobre o bootstrap do zero (fase 1 cria o
      # storage ANTES de o gate ser lido — sem isso o apply criava o bucket
      # e morria ~12 min depois no retry do gate, deixando infra parcial).
      - name: Garantir e publicar bundle da API (commit de merge)
        run: |
          python -m pip install --upgrade pip boto3
          make tf-ensure-bundle AUTO_APPROVE=1 OVERWRITE=1

      - name: Terraform Plan (auditoria do apply)
        run: make tf-plan-out

      - name: Upload apply plan (auditoria)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: apply-plan-${{ env.TF_ENV }}-${{ github.run_id }}
          path: infra/terraform/environments/${{ env.TF_ENV }}/plan.txt
          if-no-files-found: ignore

      # Aplica exatamente o plan salvo acima.
      - name: Terraform Apply
        run: make tf-apply-plan

      # A camada gold é CÓDIGO, não state: o Terraform cria o database e o
      # workgroup, e o DDL das views (src/{cold,hot}/athena_gold/*.sql) é
      # aplicado aqui, depois que eles existem. CREATE OR REPLACE VIEW é
      # idempotente — rodar a cada merge é inofensivo, e uma view alterada no
      # PR chega em produção junto com a infra que ela consulta.
      - name: Aplicar as views da camada gold (Athena)
        run: make athena-gold
