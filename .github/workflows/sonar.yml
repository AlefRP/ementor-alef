name: SonarCloud

# Gatilhos no setup oficial do SonarCloud (PR + push na master) — não é
# redundância: a análise do PR gera o Quality Gate/decoração do PR, e a da
# master atualiza o BASELINE contra o qual o "new code" dos próximos PRs é
# medido. O release.yml também espera o run da master (mesmo commit) antes
# de taguear — remover o push quebraria o release por timeout.
on:
  pull_request:
    branches: ["main", "master"]
  push:
    branches: ["main", "master"]

concurrency:
  group: sonar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[prod]

      - name: Run tests with coverage
        run: make test-cov

      # Gate da story: o job FALHA se o Quality Gate do SonarCloud reprovar.
      # O threshold (cobertura >= 90%) é configurado no Quality Gate do projeto
      # no SonarCloud (Administration > Quality Gate) e espelha o make test-cov.
      - name: Sonar scan
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          args: -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
