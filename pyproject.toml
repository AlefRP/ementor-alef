[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-lakehouse-mentoria"
version = "0.3.0"
description = "Base architecture project for AWS cold/hot data layers and governance"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Private :: Do Not Upload",
]

[project.optional-dependencies]
# Runtime da API fria (data product Olist na EC2) — async: FastAPI + psycopg 3.
api = [
  "fastapi==0.139.0",
  "uvicorn==0.50.2",
  "psycopg[binary,pool]==3.3.4", # driver async + pool de conexões
  "pydantic-settings==2.14.2",
  "boto3>=1.34,<2", # senha do RDS via Secrets Manager (SECRET_ARN)
  "fastapi-cache2==0.2.2", # cache-aside nos datasets (in-memory; Redis via REDIS_URL)
  "jinja2>=3.1.6", # dependência implícita do fastapi-cache2 (coder importa starlette.templating)
]
# Subconjunto usado pela matrix de testes (unit + TAAC + testes da API/Lambda).
test = [
  "pytest==9.0.3",
  "pytest-cov==7.1.0",
  "boto3>=1.34,<2", # TAAC live (tests/taac) — skip gracioso sem credenciais
  "httpx==0.28.1", # TestClient do FastAPI
  "moto[s3,sqs]==5.2.2", # mock de S3/SQS nos testes das Lambdas
  "faker==38.2.0", # producer da camada quente (empacotado no zip em runtime)
  "pyspark>=3.5,<3.6", # runtime dos jobs Glue silver (Glue 5.0 = Spark 3.5)
  "aws-lakehouse-mentoria[api]", # testes importam src/cold/api_fastapi
]
# Conjunto completo de ferramentas de desenvolvimento (inclui [test] e [api]).
prod = [
  "blue==0.9.1",
  "isort==5.13.2",
  "bandit==1.7.9",
  "pip-audit==2.8.0",
  "safety==2.3.1",
  "detect-secrets==1.4.0",
  "pre-commit==3.7.1",
  "aws-lakehouse-mentoria[test]", # sonar.yml instala [prod] e roda make test-cov
]
# Ferramentas de IaC (scan de segurança do Terraform).
iac = [
  "checkov>=3.2,<4",
]

# src/ é o pacote raiz importável (tests usam `from src.cold...`); sem isto o
# setuptools trataria src/ como src-layout e instalaria cold/hot como top-level.
[tool.setuptools.packages.find]
include = ["src", "src.*", "simulation", "simulation.*"]

[tool.blue]
line-length = 88

[tool.isort]
profile = "black"
line_length = 88
src_paths = ["src", "simulation", "tests"]
# Módulos do runtime Glue importados de forma flat (--extra-py-files no job).
known_first_party = ["cold_specs", "hot_specs", "iceberg", "raw", "vault"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "build"]
skips = ["B101"]

[tool.pytest.ini_options]
# importlib evita colisão entre arquivos de mesmo nome (test_smoke.py) em
# pastas diferentes ao rodar `pytest` sobre toda a árvore de testes.
addopts = "-q --import-mode=importlib"
testpaths = ["tests"]
# docs/ tem exemplos didáticos (test_codigo.py) que NÃO são a suíte do projeto.
# testpaths já limita `pytest` puro a tests/; norecursedirs blinda também a
# coleta recursiva (`pytest .`). Rodar um exemplo à mão continua possível
# apontando o arquivo: `pytest docs/test_codigo.py`. Defaults do pytest
# preservados para não desproteger .git/venv/build.
norecursedirs = [
  "*.egg",
  ".*",
  "_darcs",
  "build",
  "CVS",
  "dist",
  "node_modules",
  "venv",
  "{arch}",
  "docs",
]
markers = [
  "integration: marks tests as integration",
  "taac: marks tests as TAAC",
]

[tool.coverage.run]
source = ["src"]
branch = true
# Entrypoints dos jobs Glue importam awsglue, que só existe dentro do Glue —
# a lógica deles vive em src/glue_silver_runtime, que É coberta pelos testes.
omit = [
  "src/cold/glue_silver/job.py",
  "src/hot/glue_silver_microbatch/job.py",
]

[tool.coverage.report]
show_missing = true

[dependency-groups]
dev = [
    "moto>=5.2.2",
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
]
