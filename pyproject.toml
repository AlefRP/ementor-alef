[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-lakehouse-mentoria"
version = "0.1.0"
description = "Base architecture project for AWS cold/hot data layers and governance"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Private :: Do Not Upload",
]

[project.optional-dependencies]
# Subconjunto mínimo usado pela matrix de testes (instala rápido em toda versão).
test = [
  "pytest==8.3.5",
  "pytest-cov==5.0.0",
]
# Conjunto completo de ferramentas de desenvolvimento.
prod = [
  "blue==0.9.1",
  "isort==5.13.2",
  "pytest==8.3.5",
  "pytest-cov==5.0.0",
  "bandit==1.7.9",
  "pip-audit==2.8.0",
  "safety==2.3.1",
  "detect-secrets==1.4.0",
  "pre-commit==3.7.1",
]
# Ferramentas de IaC (scan de segurança do Terraform).
iac = [
  "checkov>=3.2,<4",
]

[tool.blue]
line-length = 88

[tool.isort]
profile = "black"
line_length = 88
src_paths = ["src", "tests"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "build"]
skips = ["B101"]

[tool.pytest.ini_options]
# importlib evita colisão entre arquivos de mesmo nome (test_smoke.py) em
# pastas diferentes ao rodar `pytest` sobre toda a árvore de testes.
addopts = "-q --import-mode=importlib"
testpaths = ["tests"]
markers = [
  "integration: marks tests as integration",
  "taac: marks tests as TAAC",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
